<!doctype html><pre id=o>running</pre><script type=module>
import { newGame, finishWeek, overall, useCalendar, teamStrength, autoLineup , userDual, playDual } from './js/game/core.js';
import { beginOffseason, startNewSeason } from './js/game/offseason.js';
const P = new URLSearchParams(location.search), SEEDS = (P.get('seeds') || '1,2').split(',').map(Number), YEARS = +(P.get('years') || 8), USER = P.get('user') || 'iowa';
const out = [], log = s => out.push(s), mean = a => a.reduce((s, x) => s + x, 0) / Math.max(1, a.length), sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); }, f = (x, d = 2) => x.toFixed(d);
const tier = p => p >= 80 ? 'A80+' : p >= 62 ? 'B62-79' : p >= 45 ? 'C45-61' : 'D<45';
try {
  const agg = { champs: {}, titleTop3: 0, seasons: 0, uniq: [], psd: [], strSd: [], tierOvr: {}, tierPrest: {}, rosterSz: [], walk: [], tierWin: {}, tierAA: {}, tierChamp: {}, finishCorr: [] };
  for (const seed of SEEDS) {
    const G = newGame(USER, 'T', seed, { real: true }); useCalendar(G); G.rec.mode = 'auto';
    const champsThis = new Set(); const start = {}; for (const t of Object.values(G.teams)) start[t.id] = t.prestige;
    for (let yr = 0; yr < YEARS; yr++) {
      let g = 0; while (G.phase === 'season' && g++ < 60) { if (P.get('ul') !== '0') G.teams[USER].lineup = autoLineup(G, USER); { const ud = userDual(G); if (ud && !ud.done) playDual(G, ud); } finishWeek(G); }
      const H = G.history[G.history.length - 1];
      (agg.utraj ||= {})[seed] = (agg.utraj[seed] || []).concat([`${f(G.teams[USER].prestige, 1)}/#${H ? H.userFinish : '-'}/${f(mean(Object.values(G.teams[USER].lineup).filter(Boolean).map(i => overall(G.wrestlers[i]))), 1)}`]);
      if (H) {
        const ch = H.champion; agg.champs[ch] = (agg.champs[ch] || 0) + 1; champsThis.add(ch); agg.seasons++;
        const top = [...Object.values(G.teams)].sort((a, b) => b.prestige - a.prestige).slice(0, 3).map(t => t.id); if (top.includes(ch)) agg.titleTop3++;
        const rank = Object.fromEntries(H.top.map((x, i) => [x.team, i + 1]));
        for (const t of Object.values(G.teams)) { const tr = tier(t.prestige); (agg.tierAA[tr] ||= []).push(H.top.slice(0, 10).some(x => x.team === t.id) ? 1 : 0); (agg.tierChamp[tr] ||= []).push(t.id === ch ? 1 : 0); }
      }
      { const row = {}, so = t => mean(Object.values(t.lineup).filter(Boolean).map(i => overall(G.wrestlers[i]))); for (const t of Object.values(G.teams)) { const k = start[t.id] >= 80 ? 'A' : start[t.id] >= 62 ? 'B' : start[t.id] >= 45 ? 'C' : (t.id === USER ? 'U' : 'D'); (row[k] ||= []).push(so(t)); } (agg.byYear ||= []).push(Object.entries(row).map(([k, v]) => k + f(mean(v), 1)).sort().join(' ')); const pe = Object.values(G.teams).filter(t => t.id !== USER && Math.abs(start[t.id] - start[USER]) <= 6); (agg.peer ||= []).push(f(mean(pe.map(so)), 1) + '/n' + pe.length); }
      const str = Object.values(G.teams).map(t => teamStrength(G, t.id)); agg.strSd.push(sd(str));
      agg.psd.push(sd(Object.values(G.teams).map(t => t.prestige)));
      for (const t of Object.values(G.teams)) {
        const tr = tier(t.prestige), ov = mean(Object.values(t.lineup).filter(Boolean).map(i => overall(G.wrestlers[i])));
        (agg.tierOvr[tr] ||= []).push(ov); (agg.rosterSz ||= []).push(t.roster.length);
        const rec = G.schedule.filter(d => d.done && (d.a === t.id || d.b === t.id)); const w = rec.filter(d => (d.result.winner === 'A') === (d.a === t.id)).length; (agg.tierWin[tr] ||= []).push(rec.length ? w / rec.length : 0);
      }
      beginOffseason(G); startNewSeason(G);
    }
    agg.uniq.push(champsThis.size);
    const endP = Object.values(G.teams).map(t => ({ id: t.id, d: t.prestige - start[t.id], p: t.prestige })); for (const t of Object.values(G.teams)) (agg.mv ||= {})[tier(start[t.id])] = ((agg.mv || {})[tier(start[t.id])] || []).concat([t.prestige - start[t.id]]); agg.moved = (agg.moved || []).concat(endP.map(x => Math.abs(x.d)));
    agg.topEnd = (agg.topEnd || []).concat([endP.sort((a, b) => b.p - a.p).slice(0, 5).map(x => `${x.id}:${f(x.p, 0)}(${x.d >= 0 ? '+' : ''}${f(x.d, 0)})`).join(' ')]);
  }
  log(`seeds ${SEEDS} x ${YEARS} yrs (user=${USER} on auto recruiting)`);
  log(`NCAA champions: ${Object.entries(agg.champs).sort((a, b) => b[1] - a[1]).map(([k, v]) => k + ' ' + v).join(', ')}`);
  log(`unique champs per ${YEARS}-yr run: ${agg.uniq.join(',')}   title won by a top-3-prestige team: ${f(100 * agg.titleTop3 / agg.seasons, 0)}%`);
  log(`prestige SD (avg) ${f(mean(agg.psd))}   team strength SD (avg) ${f(mean(agg.strSd))}   mean |prestige move| ${f(mean(agg.moved))}   roster size ${f(mean(agg.rosterSz), 1)}`);
  for (const k of ['A80+', 'B62-79', 'C45-61', 'D<45']) log(`  ${k}: starter OVR ${f(mean(agg.tierOvr[k] || [0]))}  dual win% ${f(100 * mean(agg.tierWin[k] || [0]), 0)}  top-10 NCAA ${f(100 * mean(agg.tierAA[k] || [0]), 0)}%  title ${f(100 * mean(agg.tierChamp[k] || [0]), 1)}%  n=${(agg.tierOvr[k] || []).length}`);
  for (const k of ['A80+', 'B62-79', 'C45-61', 'D<45']) { const a = agg.mv[k] || [0]; log(`  prestige change over ${YEARS}y, start tier ${k}: mean ${f(mean(a))} mean|d| ${f(mean(a.map(Math.abs)))} min ${f(Math.min(...a))} max ${f(Math.max(...a))}`); }
  log('starter OVR by start-tier per year (last seed): ' + agg.byYear.slice(-YEARS).join(' | '));
  log('AI peers (+-6 prestige of user) per year (last seed): ' + agg.peer.slice(-YEARS).join(' '));
  log('user prestige/NCAA finish/starter OVR per year: ' + JSON.stringify(agg.utraj));
  log('top5 end prestige (per seed): ' + agg.topEnd.join(' | '));
} catch (e) { log('ERR ' + e.stack); }
document.getElementById('o').textContent = out.join('\n');
</script>
